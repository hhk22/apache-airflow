name: python static checks and tests

on: [push]

jobs:
  testing:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.0
          architecture: x64
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8 
        run: flake8 || true
      
      - name: Install Pylint
        run: pip install pylint
      - name: Run Pylint
        run: find . -name "*.py" | xargs pylint --output-format=colorized || true
      
      - name: Install dependencies
        run: pip install apache-airflow==2.10.4 pytest pytest-mock redis
      
      - name: Test DAG integrity
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/dags
          pytest tests/ --ignore=tests/test_instance.context.py
